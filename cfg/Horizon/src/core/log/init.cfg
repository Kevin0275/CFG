alias +hzLog_banConsole "log_flags Console +DoNotEcho"
alias -hzLog_banConsole "log_flags Console -DoNotEcho"

alias +hzLog_banGeneral "log_flags General +DoNotEcho"
alias -hzLog_banGeneral "log_flags General -DoNotEcho"
alias -hzLog_banGeneral_ticked "-hzLog_banGeneral;alias hzTicker_120ms_hzLog"
alias -hzLog_banGeneral_later "alias hzTicker_120ms_hzLog -hzLog_banGeneral_ticked" 

alias +hzLog_banIS "log_flags InputService +DoNotEcho"
alias -hzLog_banIS "log_flags InputService -DoNotEcho"